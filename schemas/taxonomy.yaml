# RAMP controlled vocabulary for skill and pack navigation.
# Schema: taxonomy-v1.schema.json. Every classification value in a skill.yaml
# and every pack use case must be an id listed here. Adding a value is a
# reviewed change to this file; the lint rejects any value not listed.
# Lists are displayed by ascending order, then by id.
schemaVersion: 1
useCases:
  - id: application-modernization
    label: Modernize an existing application
    description: Legacy decomposition, framework upgrade, .NET, API platform and COTS rewrite.
    outcome: transform
    order: 10
  - id: cloud-native-development
    label: Build a cloud-native application
    description: Serverless, containers, event-driven, web and mobile back ends.
    outcome: reimagine
    order: 20
  - id: generative-ai-and-agents
    label: Build generative AI and agents
    description: Bedrock, voice agents and agentic workflows.
    outcome: reimagine
    order: 30
  - id: quality-engineering
    label: Automate testing
    description: Web, mobile, regression and property-based testing.
    outcome: automate
    order: 40
