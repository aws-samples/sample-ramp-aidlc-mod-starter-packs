name: java-upgrade-containerisation
title: Java LTS Upgrade + Containerisation
description: >
  Upgrade an existing Java service to the latest Java LTS (plus framework upgrade) and run it as a
  container on AWS ECS/EKS — via the AI-DLC decision-driven workflow. Region, platform, VCS/CI, and
  permitted tooling are discovered and gated in-flow (validated with the AWS Knowledge MCP), not
  assumed. Monolith→microservices decomposition is an optional, separately-gated stretch target.

instructions:
  - file: aidlc-workflow.md
    role: primary
  - file: skill-activation.md
    role: companion
    load: always
  - file: reverse-engineering.md
    role: companion
    load: auto
    description: "Phase 0 upgrade-focused assessment — detect JDK/framework/build tool, container status, and the Java-version risk surface. Framed for upgrade, not decomposition."

command:
  name: aidlc
  description: Start the AI-DLC decision-gated Java LTS upgrade + containerisation workflow

mcp:
  - id: aws-knowledge-mcp-server
    command: npx
    args: ["mcp-remote", "https://knowledge-mcp.global.api.aws"]
    disabled: false
    autoApprove:
      - aws___search_documentation
      - aws___read_documentation
      - aws___get_regional_availability
      - aws___list_regions

skills: all
