name: verify

# Committed scaffolds and no-Node skill helpers are regenerated from source.
# The runner synchronizes immutable upstream skills into one disposable cache,
# verifies them offline, and then proves every committed output is current.
on:
  push:
    branches: [main, revamp-starter-packs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The runner context is unavailable in jobs.<id>.env, so export the path here.
      - name: Point the skill cache at runner temp
        run: echo "RAMP_SKILLS_CACHE=$RUNNER_TEMP/ramp-skills" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install installer deps
        run: npm ci --prefix installer
      - name: Assert clean skill caches
        run: |
          test ! -e "$RAMP_SKILLS_CACHE"
          test ! -e .ramp-cache
      - name: Confirm locked pilot mirrors match the lock without a cache
        env:
          RAMP_PILOT_CACHE_EXPECTATION: unsynchronized
        run: npm test --prefix installer -- test/pilot-skill-provenance.test.js
      - name: Synchronize locked upstream skills
        run: |
          node installer/bin/ramp-pack.js skills sync \
            --locked \
            --cache "$RAMP_SKILLS_CACHE"
      - name: Verify synchronized skills offline
        run: |
          node installer/bin/ramp-pack.js skills verify \
            --cache "$RAMP_SKILLS_CACHE"
      - name: Run installer test suite
        run: npm test --prefix installer
      # npm test samples one target tool per pack; this step compares every
      # route, pack and target tool with the baseline, and pwsh must be present.
      - name: Compare the full customer-layout matrix with the baseline
        env:
          RAMP_CUSTOMER_LAYOUT: full
          RAMP_REQUIRE_POWERSHELL: pwsh
        run: npm test --prefix installer -- test/customer-layout.test.js
      - name: Regenerate committed scaffolds and helpers
        run: ./scripts/regenerate.sh
      - name: Fail on generated-output drift
        run: |
          if ! git diff --quiet -- \
            'packs/*/scaffolded-packs' \
            'packs/*/add-skills.sh' \
            'packs/*/add-skills.ps1'; then
            echo "::error::Committed scaffolds and skill helpers are out of date. Run ./scripts/regenerate.sh and commit."
            git --no-pager diff --stat -- \
              'packs/*/scaffolded-packs' \
              'packs/*/add-skills.sh' \
              'packs/*/add-skills.ps1'
            exit 1
          fi
          echo "Committed scaffolds and helpers are in sync with source."
      - name: Assert no repository-local skill cache
        run: test ! -e .ramp-cache

  # The bundle helpers run on both runner families. Each listed PowerShell
  # engine must be present, so a missing engine fails instead of skipping.
  # The QA harness coverage test builds real release ZIPs, so it needs the
  # synchronized skill cache, and fails without it here.
  helpers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            powershell: pwsh
            tests: test/install-bash.test.js test/install-powershell.test.js test/windows-helper-fixtures.test.js test/qa-harness-coverage.test.js
          - os: windows-latest
            powershell: powershell.exe,pwsh
            tests: test/install-powershell.test.js test/windows-helper-fixtures.test.js test/qa-harness-coverage.test.js
    runs-on: ${{ matrix.os }}
    steps:
      # The runner context is unavailable in jobs.<id>.env, so export the path here.
      - name: Point the skill cache at runner temp
        shell: bash
        run: echo "RAMP_SKILLS_CACHE=$RUNNER_TEMP/ramp-skills" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install installer deps
        run: npm ci --prefix installer
      - name: Synchronize locked upstream skills
        shell: bash
        run: |
          node installer/bin/ramp-pack.js skills sync \
            --locked \
            --cache "$RAMP_SKILLS_CACHE"
      - name: Verify synchronized skills offline
        shell: bash
        run: |
          node installer/bin/ramp-pack.js skills verify \
            --cache "$RAMP_SKILLS_CACHE"
      - name: Run helper scenario tests
        env:
          RAMP_REQUIRE_POWERSHELL: ${{ matrix.powershell }}
        run: npm test --prefix installer -- ${{ matrix.tests }}
