name: release-packs

# Builds one pack's qualified release ZIPs twice, fails unless both builds are
# byte-identical, proves the bundle helpers on Linux and Windows, and uploads
# the archives plus SHA256SUMS as a workflow artifact. Attaching them to the
# existing GitHub Release happens only when an owner dispatches this workflow
# on a tag with publish=true. Nothing here creates AWS resources or Pages.
on:
  workflow_dispatch:
    inputs:
      pack:
        description: Pack directory name under packs/
        required: true
        type: string
      publish:
        description: Attach the verified ZIPs to the GitHub Release for this tag
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-packs-${{ github.ref }}-${{ inputs.pack }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACK: ${{ inputs.pack }}
    steps:
      # The runner context is unavailable in jobs.<id>.env, so export the path here.
      - name: Point the skill cache at runner temp
        run: echo "RAMP_SKILLS_CACHE=$RUNNER_TEMP/ramp-skills" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install installer deps from the lockfile
        run: npm ci --prefix installer
      - name: Pin the build time to the source commit
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Synchronize locked upstream skills
        run: |
          node installer/bin/ramp-pack.js skills sync \
            --locked \
            --cache "$RAMP_SKILLS_CACHE"
      - name: Verify synchronized skills offline
        run: |
          node installer/bin/ramp-pack.js skills verify \
            --cache "$RAMP_SKILLS_CACHE"
      - name: Run installer test suite
        run: npm test --prefix installer
      - name: Verify Bash and pwsh helper installs
        env:
          RAMP_REQUIRE_POWERSHELL: pwsh
        run: |
          npm test --prefix installer -- \
            test/install-bash.test.js \
            test/install-powershell.test.js \
            test/windows-helper-fixtures.test.js
      - name: Build release archives twice and compare bytes
        run: |
          node scripts/verify-release-determinism.mjs \
            --pack "$PACK" \
            --out dist \
            --cache "$RAMP_SKILLS_CACHE"
      - name: Upload verified archives and checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.pack }}
          path: dist/
          if-no-files-found: error

  windows-helpers:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install installer deps from the lockfile
        run: npm ci --prefix installer
      - name: Verify PowerShell helper installs
        env:
          RAMP_REQUIRE_POWERSHELL: powershell.exe,pwsh
        run: npm test --prefix installer -- test/install-powershell.test.js test/windows-helper-fixtures.test.js

  publish:
    needs: [build, windows-helpers]
    if: inputs.publish == true && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified archives and checksums
        uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.pack }}
          path: dist
      - name: Recheck the downloaded archives
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      # Upload to the existing Release for this tag; without --clobber an asset
      # that is already attached is never replaced.
      - name: Attach archives to the existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"
