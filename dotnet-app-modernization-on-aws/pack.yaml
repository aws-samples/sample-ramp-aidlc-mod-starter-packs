name: dotnet-app-modernization-on-aws
title: .NET App Modernization on AWS
description: Modernize .NET applications onto AWS — ASP.NET Framework → ASP.NET Core (via AWS Transform) → containers on Amazon ECS Fargate.

instructions:
  - file: aidlc-workflow.md
    role: primary
  - file: skill-activation.md
    role: companion
    load: always
  - file: reverse-engineering.md
    role: companion
    load: auto
    description: "Phase 0 reverse-engineering playbook — brownfield-first for .NET modernization. Use when existing .NET source is present, or when modernizing, migrating, replatform-ing, or containerizing an existing app. Ingests pre-existing AWS Transform (ATX) analysis if found."

command:
  name: aidlc
  description: Start the AI-DLC decision-gated modernization workflow for this pack

mcp:
  - id: aws-knowledge-mcp-server
    command: npx
    args: ["mcp-remote", "https://knowledge-mcp.global.api.aws"]
    disabled: false
    autoApprove:
      - aws___search_documentation
  - id: aws-mcp-server
    command: uvx
    args: ["mcp-proxy-for-aws@latest", "https://aws-mcp.us-east-1.api.aws/mcp"]
    disabled: true
  - id: aurora-dsql
    command: uvx
    args: ["awslabs.aurora-dsql-mcp-server@latest"]
    env:
      FASTMCP_LOG_LEVEL: ERROR

skills: all
