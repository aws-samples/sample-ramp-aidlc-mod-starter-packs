name: enterprise-app-on-cloudnative
title: Enterprise App on Cloud-Native
description: Cloud-native enterprise app — a line-of-business / transactional system.

instructions:
  - file: aidlc-workflow.md
    role: primary
  - file: skill-activation.md
    role: companion
    load: always
  - file: reverse-engineering.md
    role: companion
    load: auto
    description: "Phase 0 Reverse Engineering / Input Analysis playbook — use when existing source code is present, or when the user provides functional/design documents (FSDs, platform exports such as OutSystems), or when modernizing, migrating, extending, or reverse-engineering an existing system."
  - file: requirements-traceability.md
    role: companion
    load: auto
    description: "Requirements traceability & fidelity for document/FSD-driven work. Use whenever generating or reviewing requirements from FSDs, functional specs, screenshots, or a migration/rewrite of an existing app (e.g. OutSystems): ground every requirement in an FSD/screen anchor, produce a Traceability Matrix with bidirectional coverage, and tag NEW / NEEDS-CLARIFICATION instead of inventing or dropping behavior. Applies during Phase 1 requirements.md generation and its approval gate. Skip for pure greenfield with no source documents."

command:
  name: aidlc
  description: Start the AI-DLC decision-gated workflow for this pack
  body: |
    You are an AI-DLC modernization architect. Execute this workflow in order:
    1. Read `aidlc-docs/aidlc-state.md` and resume the next incomplete step when state exists; otherwise initialize state and audit tracking as required by the primary instructions.
    2. Detect the input mode: existing source code in the workspace and/or functional documents (FSDs, platform exports such as OutSystems) provided by the user. If either is present, run Phase 0 (Reverse Engineering / Input Analysis); if pure greenfield, skip to Phase 1.
    3. In Phase 0, adapt each step to the input mode, tag every finding with its evidence source (Code / Doc / Assumption), keep an Assumptions and Open Questions list, and stop at the approval gate.
    4. Proceed through the phases in sequence: Phase 1 Requirements, then Phase 2 Domain Model and Bounded Contexts, then Phase 3 Design, then Phase 4 Tasks. Phase 2 always runs and is the contract Design and Tasks map onto.
    5. For every phase, create and complete its matching `_decisions-*.md` first, wait for explicit user decisions, generate the phase artifact, and honor every approval gate before continuing.

mcp:
  - id: aws-knowledge-mcp-server
    command: npx
    args: ["mcp-remote", "https://knowledge-mcp.global.api.aws"]
    autoApprove:
      - aws___search_documentation
      - aws___read_documentation
      - aws___get_regional_availability
      - aws___list_regions
  - id: aurora-dsql
    command: uvx
    args: ["awslabs.aurora-dsql-mcp-server@latest"]
    env:
      FASTMCP_LOG_LEVEL: ERROR
  - id: awslabs.aws-iac-mcp-server
    command: uvx
    args: ["awslabs.aws-iac-mcp-server@latest"]
    env:
      AWS_PROFILE: your-named-profile
      FASTMCP_LOG_LEVEL: ERROR
    autoApprove: []
    disabled: false

skills: all
