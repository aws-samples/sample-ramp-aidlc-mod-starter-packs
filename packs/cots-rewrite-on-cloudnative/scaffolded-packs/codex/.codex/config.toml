[mcp_servers.aws-knowledge-mcp-server]
command = "npx"
args = ["mcp-remote", "https://knowledge-mcp.global.api.aws"]

[mcp_servers.aurora-dsql]
command = "uvx"
args = ["awslabs.aurora-dsql-mcp-server@latest"]

[mcp_servers.aurora-dsql.env]
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers."awslabs.aws-iac-mcp-server"]
command = "uvx"
args = ["awslabs.aws-iac-mcp-server@latest"]

[mcp_servers."awslabs.aws-iac-mcp-server".env]
AWS_PROFILE = "your-named-profile"
FASTMCP_LOG_LEVEL = "ERROR"
