schemaVersion: 2
kind: ramp-pack

name: qa-automated-testing
title: QA Automated Testing
description: Automated test suites for web and mobile applications, driven by the AI-DLC decision-gated workflow.
version: 0.1.0

catalog:
  outcome: automate
  domain: quality-engineering
  executionModel: assisted-builder
  maturity: preview

workflow:
  provider: local-instructions-v1
  overlays:
    - qa-existing-test-inventory.md

instructions:
  - file: aidlc-workflow.md
    role: primary
  - file: skill-activation.md
    role: companion
    load: always
  - file: reverse-engineering.md
    role: companion
    load: auto
    description: "Phase 0 reverse-engineering playbook — use when existing or brownfield source code is present, or when modernizing, migrating, extending, or reverse-engineering an existing system."

command:
  name: aidlc
  description: Start the AI-DLC decision-gated workflow for this pack

mcp:
  - id: aws-knowledge-mcp-server
    transport: http
    url: https://knowledge-mcp.global.api.aws

skills:
  - amazon-bedrock
  - aws-iam
  - aws-lambda
  - aws-lambda-microvms
  - aws-step-functions
  - connecting-lambda-to-api-gateway
  - mobile-test-automation
  - web-test-automation

distribution:
  targets: [kiro, claude-code, copilot, cursor]
  qualifiedTargets: [kiro, claude-code]
  profiles: []
